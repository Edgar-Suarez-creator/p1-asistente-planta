services:
  app:
    build:
      context: ..
      dockerfile: p1-asistente-planta/Dockerfile
    ports: ["8001:8001"]
  neo4j:
    image: neo4j:5.25
    environment:
      NEO4J_AUTH: neo4j/planta-demo   # credencial local de demostración, no de producción
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data"]
volumes:
  neo4j-data:
